{% extends 'base.html' %}

{% block title %}Rejeter une inscription | BSB{% endblock %}

{% block content %}
<div class="max-w-2xl py-10 mx-auto">
    <!-- Header -->

   {% include 'partials/messages.html' %}
    <div class="mb-8">
        <div class="flex items-center mb-4">
            <a href="{% url 'courses:valide_inscription' %}" class="text-gray-600 hover:text-gray-900 mr-4">Retour</a>
            <h1 class="text-3xl font-black text-red-600 flex items-center">
                
                Confirmer le rejet
            </h1>
        </div>
    </div>

    <!-- Confirmation Card -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden border-2 border-red-200">

        <form method="POST" action="{% url 'courses:rejeter_inscription' subscription.id %}">
            {% csrf_token %}

            <div class="px-8 py-6">
                <!-- Warning -->
                <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4">
                    <div class="flex">
                        
                        <div>
                            <h3 class="text-sm font-medium text-yellow-800">Attention!</h3>
                            <p class="mt-1 text-sm text-yellow-700">
                                Vous êtes sur le point de rejeter cette demande d'inscription.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Motif -->
                <div class="mt-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        Motif du rejet <span class="text-red-500">*</span>
                    </label>
                    <textarea name="motif" rows="4" required
                              placeholder="Expliquez la raison du rejet..."
                              class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm
                                     focus:outline-none focus:border-red-400 resize-none"></textarea>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="bg-gray-50 px-8 py-6 flex items-center justify-center space-x-4 border-t border-gray-200">
                <a href="{% url 'bsb_admin:subscription_en_cours' %}"
                   class="px-8 py-3 border-2 border-gray-300 rounded-lg text-gray-700 font-bold hover:bg-gray-100 transition-all">
                    Non, annuler
                </a>
                <button type="submit"
                        class="px-8 py-3 bg-gradient-to-r from-red-600 to-red-700 text-white font-bold rounded-lg
                               hover:from-red-700 hover:to-red-800 shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5">
                    Confirmer le rejet
                </button>
            </div>

        </form>
    </div>
</div>

<script>
  setTimeout(function () {
    document.querySelectorAll('[class*="border-l-4"]').forEach(function(el) {
      el.remove();
    });
  }, 5000);
</script>
{% endblock %}
