<!DOCTYPE html>
<!--
  Page 429 servie DIRECTEMENT par nginx (limit_req), sans passer par Django.
  Elle doit donc être 100 % autonome : styles en ligne, aucune dépendance JS.
  Le logo est tiré de /static/ (servi par nginx même backend éteint).
-->
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trop de tentatives — BSB</title>
    <style>
        :root { --red:#e53935; --dark:#b71c1c; --yellow:#fbc02d; --ink:#1f2937; --muted:#6b7280; --cream:#fff8e1; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
               padding:4rem 1rem; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
               background:linear-gradient(to bottom,var(--cream),#fff 55%); color:var(--ink); }
        .card { width:100%; max-width:34rem; text-align:center; position:relative; }
        .ghost { position:absolute; inset:0; z-index:-1; display:flex; align-items:center; justify-content:center;
                 font-size:34vw; font-weight:900; color:rgba(229,57,53,.05); line-height:1; letter-spacing:-.05em; }
        .logo { height:4rem; margin:0 auto 1.5rem; display:block; }
        .badge-icon { width:5rem; height:5rem; margin:0 auto 1.5rem; border-radius:1rem; display:flex; align-items:center;
                      justify-content:center; background:var(--yellow); color:var(--ink); box-shadow:0 10px 20px rgba(0,0,0,.12); }
        .tag { display:inline-flex; align-items:center; gap:.4rem; padding:.25rem .75rem; margin-bottom:1rem;
               border-radius:999px; background:rgba(31,41,55,.05); font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
        .dot { width:.4rem; height:.4rem; border-radius:999px; background:var(--yellow); }
        h1 { font-size:2rem; font-weight:900; margin:0 0 .75rem; }
        p { color:var(--muted); line-height:1.6; margin:0 auto 2rem; max-width:28rem; }
        .btn { display:inline-flex; align-items:center; gap:.5rem; padding:.8rem 1.5rem; border-radius:.75rem;
               background:linear-gradient(to right,var(--red),var(--dark)); color:#fff; font-weight:700;
               text-decoration:none; box-shadow:0 6px 14px rgba(183,28,28,.28); }
        .help { margin-top:2.5rem; font-size:.75rem; color:var(--muted); }
        .help a { color:var(--red); font-weight:600; }
    </style>
</head>
<body>
    <div class="card">
        <div class="ghost">429</div>
        <img class="logo" src="/static/images/logo.png" alt="Burkina Suudu Bawdè">
        <div class="badge-icon">
            <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 2m6-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <span class="tag"><span class="dot"></span> Erreur 429</span>
        <h1>Trop de tentatives</h1>
        <p>Vous avez envoyé trop de requêtes en peu de temps. Cette limite protège la plateforme.
           Patientez une minute, puis réessayez tranquillement.</p>
        <a class="btn" href="/">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
            Retour à l'accueil
        </a>
        <p class="help">Besoin d'aide ? <a href="mailto:burkinasuudubawdeyupaan@gmail.com">burkinasuudubawdeyupaan@gmail.com</a></p>
    </div>
</body>
</html>
