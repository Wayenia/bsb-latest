<!DOCTYPE html>
<!--
  Page 502/503/504 servie DIRECTEMENT par nginx quand le backend est injoignable
  (redémarrage, maintenance, surcharge). 100 % autonome : aucune dépendance au
  backend. Le logo vient de /static/, servi par nginx indépendamment de Django.
-->
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service momentanément indisponible — BSB</title>
    <style>
        :root { --red:#e53935; --dark:#b71c1c; --ink:#1f2937; --muted:#6b7280; --cream:#fff8e1; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
               padding:4rem 1rem; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
               background:linear-gradient(to bottom,var(--cream),#fff 55%); color:var(--ink); }
        .card { width:100%; max-width:34rem; text-align:center; position:relative; }
        .ghost { position:absolute; inset:0; z-index:-1; display:flex; align-items:center; justify-content:center;
                 font-size:30vw; font-weight:900; color:rgba(229,57,53,.05); line-height:1; letter-spacing:-.05em; }
        .logo { height:4rem; margin:0 auto 1.5rem; display:block; }
        .badge-icon { width:5rem; height:5rem; margin:0 auto 1.5rem; border-radius:1rem; display:flex; align-items:center;
                      justify-content:center; background:var(--red); color:#fff; box-shadow:0 10px 20px rgba(0,0,0,.12); }
        .tag { display:inline-flex; align-items:center; gap:.4rem; padding:.25rem .75rem; margin-bottom:1rem;
               border-radius:999px; background:rgba(31,41,55,.05); font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
        .dot { width:.4rem; height:.4rem; border-radius:999px; background:var(--red); }
        h1 { font-size:2rem; font-weight:900; margin:0 0 .75rem; }
        p { color:var(--muted); line-height:1.6; margin:0 auto 2rem; max-width:28rem; }
        .btn { display:inline-flex; align-items:center; gap:.5rem; padding:.8rem 1.5rem; border-radius:.75rem;
               background:linear-gradient(to right,var(--red),var(--dark)); color:#fff; font-weight:700;
               text-decoration:none; box-shadow:0 6px 14px rgba(183,28,28,.28); }
        .help { margin-top:2.5rem; font-size:.75rem; color:var(--muted); }
        .help a { color:var(--red); font-weight:600; }
    </style>
</head>
<body>
    <div class="card">
        <div class="ghost">503</div>
        <img class="logo" src="/static/images/logo.png" alt="Burkina Suudu Bawdè">
        <div class="badge-icon">
            <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728M12 12h.01"/><path stroke-linecap="round" stroke-linejoin="round" d="M8.464 8.464a5 5 0 000 7.072m7.072 0a5 5 0 000-7.072"/></svg>
        </div>
        <span class="tag"><span class="dot"></span> Maintenance</span>
        <h1>Service momentanément indisponible</h1>
        <p>La plateforme est en cours de mise à jour ou temporairement surchargée.
           Nous revenons dans quelques instants — merci de réessayer sous peu.</p>
        <a class="btn" href="/">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Réessayer
        </a>
        <p class="help">Le problème persiste ? <a href="mailto:guess.solomnde.comtact@gmail.com">guess.solomnde.comtact@gmail.com</a></p>
    </div>
</body>
</html>
