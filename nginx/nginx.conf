upstream suudu_backend {
    server suudu_backend:8000;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 0.0.0.0;

    server_tokens off;
    client_max_body_size 30m;

    # Bloque l'accès aux fichiers cachés (.env, .git, .htaccess, ...)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Bloque les source maps JS (facilitent la lecture/debug du JS par un attaquant)
    location ~ \.map$ {
        deny all;
        return 404;
    }

    # La CSP des pages HTML est posée par Django (middleware natif, avec nonce
    # par requête) et nginx --> /static/ et /media/.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-AspNet-Version;
    proxy_hide_header X-AspNetMvc-Version;

    # Static files
    # Note nginx : un location qui definit son propre add_header n'herite plus
    # d'AUCUN add_header du bloc server parent - il faut donc les repeter ici.
    location /static/ {
        alias /app/staticfiles/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
    }

    # Media files
    location /media/ {
        alias /app/media/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Django application
    location / {
        # seules les méthodes GET, POST, HEAD de navigation sont utiles. 
        limit_except GET POST HEAD {
            deny all;
        }

        proxy_pass http://suudu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer $http_referer;
        proxy_set_header Origin $http_origin;

        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # X-Frame-Options, X-Content-Type-Options et Referrer-Policy ne sont PAS
        # repetes ici : Django les pose deja 
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
