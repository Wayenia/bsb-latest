upstream suudu_backend {
    server suudu_backend:8000;
}

# IP reelle du visiteur : derniere entree de X-Forwarded-For, la seule que le
# client ne puisse pas forger. $remote_addr vaut l'adresse du proxy amont.
map $http_x_forwarded_for $ip_client {
    default                        $http_x_forwarded_for;
    ""                             $remote_addr;
    "~,[ ]*(?<derniere>[^,\s]+)$"  $derniere;
}

# Ne jamais ecraser X-Forwarded-Proto par $scheme, qui vaut toujours http
# derriere le proxy TLS : Django en conclurait que la requete n'est pas sure.
map $http_x_forwarded_proto $proto_origine {
    default  $http_x_forwarded_proto;
    ""       $scheme;
}

# Zones anti-force brute. 10m = ~160 000 adresses suivies simultanement.
limit_req_zone $ip_client zone=connexion:10m rate=20r/m;
limit_req_zone $ip_client zone=formulaire:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name localhost 127.0.0.1 0.0.0.0;

    server_tokens off;
    client_max_body_size 30m;

    # Bloque les fichiers caches (.env, .git, .htaccess).
    location ~ /\. {
        deny all;
        return 404;
    }

    # Bloque les source maps JS.
    location ~ \.map$ {
        deny all;
        return 404;
    }

    # La CSP des pages HTML est posee par Django ; nginx couvre /static/ et /media/.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-AspNet-Version;
    proxy_hide_header X-AspNetMvc-Version;

    # Poses au niveau server : les location qui ne redefinissent aucun
    # proxy_set_header en heritent.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_origine;
    proxy_set_header Referer $http_referer;
    proxy_set_header Origin $http_origin;

    # Un location qui declare un add_header n'herite plus d'aucun add_header du
    # bloc server : ils sont donc repetes ici.
    location /static/ {
        alias /app/staticfiles/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
    }

    # Content-Disposition attachment : les documents deposes sont telecharges et
    # jamais rendus dans l'onglet, ce qui neutralise le XSS stocke.
    location /media/ {
        alias /app/media/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public";
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # nginx plafonne le debit par adresse, accounts/ratelimit.py verrouille le
    # compte cible : les deux sont complementaires (README 9).
    location ^~ /accounts/login {
        limit_req zone=connexion burst=10 nodelay;
        proxy_pass http://suudu_backend;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Formulaires publics anonymes : sans plafond, l'un sature le disque et
    # l'autre la table des abonnes.
    location ^~ /accounts/register {
        limit_req zone=formulaire burst=10 nodelay;
        proxy_pass http://suudu_backend;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    location ^~ /actualites/abonnement {
        limit_req zone=formulaire burst=5 nodelay;
        proxy_pass http://suudu_backend;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    location / {
        # Seules les methodes de navigation sont utiles.
        limit_except GET POST HEAD {
            deny all;
        }

        proxy_pass http://suudu_backend;

        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # Les autres en-tetes ne sont pas repetes ici : Django les pose deja.
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
