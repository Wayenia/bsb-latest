upstream suudu_backend {
    server suudu_backend:8000;
}

# Adresse IP reelle du visiteur.
# Le TLS est termine par un proxy amont : $remote_addr vaut l'adresse de CE
# proxy, identique pour tous les visiteurs, et ne peut donc pas servir de cle de
# limitation (elle plafonnerait tout le monde ensemble). On prend la derniere
# entree de X-Forwarded-For : c'est celle que le proxy amont a observee. Les
# entrees precedentes peuvent avoir ete forgees par le client, jamais la
# derniere. Django applique la meme regle dans accounts/ratelimit.py, decalee
# d'un cran puisque nginx aura ajoute sa propre entree entre-temps.
map $http_x_forwarded_for $ip_client {
    default                        $http_x_forwarded_for;
    ""                             $remote_addr;
    "~,[ ]*(?<derniere>[^,\s]+)$"  $derniere;
}

# Protocole d'origine de la requete.
# Ne JAMAIS ecraser X-Forwarded-Proto par $scheme : nginx ecoute en clair sur le
# port 80 derriere le proxy TLS, $scheme vaut donc toujours "http". Django en
# concluait request.is_secure() == False, avec pour consequences : en-tete HSTS
# jamais emis malgre SECURE_HSTS_SECONDS, et liens generes en http:// dans les
# e-mails d'actualites. On conserve la valeur transmise par le proxy amont.
map $http_x_forwarded_proto $proto_origine {
    default  $http_x_forwarded_proto;
    ""       $scheme;
}

# Zones anti-force brute. 10m = ~160 000 adresses suivies simultanement.
limit_req_zone $ip_client zone=connexion:10m rate=20r/m;
limit_req_zone $ip_client zone=formulaire:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name localhost 127.0.0.1 0.0.0.0;

    server_tokens off;
    client_max_body_size 30m;

    # Bloque l'accès aux fichiers cachés (.env, .git, .htaccess, ...)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Bloque les source maps JS (facilitent la lecture/debug du JS par un attaquant)
    location ~ \.map$ {
        deny all;
        return 404;
    }

    # La CSP des pages HTML est posée par Django (middleware natif, avec nonce
    # par requête) et nginx --> /static/ et /media/.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-AspNet-Version;
    proxy_hide_header X-AspNetMvc-Version;

    # En-tetes de proxy poses au niveau server : les blocs location qui ne
    # redefinissent aucun proxy_set_header en heritent, ce qui evite de les
    # repeter dans chaque location proxyee. (Contrairement a add_header, qui lui
    # ne s'herite plus des qu'un location en declare un - cf. note ci-dessous.)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_origine;
    proxy_set_header Referer $http_referer;
    proxy_set_header Origin $http_origin;

    # Static files
    # Note nginx : un location qui definit son propre add_header n'herite plus
    # d'AUCUN add_header du bloc server parent - il faut donc les repeter ici.
    location /static/ {
        alias /app/staticfiles/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
    }

    # Media files
    # Content-Disposition: attachment --> les documents deposes par les usagers
    # (pieces d'identite, justificatifs, curricula) sont toujours telecharges,
    # jamais rendus dans l'onglet. Neutralise le XSS stocke via un fichier
    # polyglotte qui passerait les controles d'extension et de signature.
    location /media/ {
        alias /app/media/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public";
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Points d'entree d'authentification : limitation stricte.
    # burst=10 nodelay laisse passer une rafale courte (rechargements, retour
    # arriere du navigateur) puis plafonne a 20 requetes/minute et par IP.
    # Ce garde-fou est complementaire du verrou applicatif
    # (accounts/ratelimit.py) : nginx plafonne le DEBIT par adresse, Django
    # verrouille le COMPTE cible - qui, lui, ne peut pas etre usurpe.
    location ^~ /accounts/login {
        limit_req zone=connexion burst=10 nodelay;
        proxy_pass http://suudu_backend;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Formulaires publics anonymes : creation de compte (qui accepte un fichier
    # joint) et abonnement newsletter (qui cree une ligne en base). Sans plafond,
    # l'un sature le disque et l'autre la table des abonnes.
    location ^~ /accounts/register {
        limit_req zone=formulaire burst=10 nodelay;
        proxy_pass http://suudu_backend;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    location ^~ /actualites/abonnement {
        limit_req zone=formulaire burst=5 nodelay;
        proxy_pass http://suudu_backend;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Django application
    location / {
        # seules les méthodes GET, POST, HEAD de navigation sont utiles.
        limit_except GET POST HEAD {
            deny all;
        }

        proxy_pass http://suudu_backend;

        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # X-Frame-Options, X-Content-Type-Options et Referrer-Policy ne sont PAS
        # repetes ici : Django les pose deja
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
