{% extends 'base.html' %}

{% block title %}Désabonnement | BSB{% endblock %}

{% block content %}
<section class="py-20 bg-white">
    <div class="max-w-xl mx-auto px-4 text-center">
        <div class="bsb-info-card p-10">
            <h1 class="text-2xl font-extrabold text-bsb-ink mb-3">Désabonnement confirmé</h1>
            <div class="bsb-rule mx-auto mb-6"></div>
            <p class="text-bsb-muted mb-8">
                L'adresse <strong class="text-bsb-ink">{{ abonne.email }}</strong> ne recevra plus
                d'e-mail lors de la publication d'une actualité.
            </p>
            <a href="{% url 'actualites:liste' %}" class="bsb-btn bsb-btn-primary">Retour aux actualités</a>
        </div>
    </div>
</section>
{% endblock %}
