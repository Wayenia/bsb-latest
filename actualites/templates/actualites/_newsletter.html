{% comment %} Bloc d'abonnement, réutilisé sur la liste et le détail {% endcomment %}
<section class="bsb-gradient py-16 md:py-20">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <h2 class="text-2xl md:text-3xl font-extrabold text-white mb-3">Ne manquez aucune actualité</h2>
        <p class="text-white/90 mb-8">Recevez un e-mail dès qu'une nouvelle actualité est publiée sur Yu-Paan.</p>
        <form method="post" action="{% url 'actualites:abonnement' %}" class="flex flex-col sm:flex-row gap-3 justify-center">
            {% csrf_token %}
            <input type="hidden" name="suivant" value="{{ request.path }}">
            <input type="text" name="site_web" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true">
            <label for="id_email" class="sr-only">Adresse e-mail</label>
            <input type="email" name="email" id="id_email" required placeholder="votre.adresse@exemple.bf"
                   class="w-full sm:w-80 px-5 py-3 rounded-full border-0 text-bsb-ink placeholder-bsb-muted focus:outline-none focus:ring-2 focus:ring-white">
            <button type="submit" class="bsb-btn bsb-btn-light">S'abonner</button>
        </form>
    </div>
</section>
