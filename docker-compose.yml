services:
  suudu_backend:
    build: .
    container_name: suudu_backend
    restart: unless-stopped
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - suudu_security_logs:/app/logs
    command: ["./entrypoint.sh"]
    env_file:
      - .env
    environment:
      - HOST_IP=${HOST_IP:-}
    depends_on:
      suudu_db:
        condition: service_healthy
      suudu_redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login', timeout=5)"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - suudu_net

  suudu_db:
    image: postgres:15.15-trixie
    container_name: suudu_db
    volumes:
      - suudu_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      - suudu_net

  suudu_nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: suudu_nginx
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      suudu_backend:
        condition: service_healthy
    networks:
      - suudu_net

  suudu_redis:
    image: redis:bookworm
    container_name: suudu_redis
    restart: unless-stopped
    volumes:
      - suudu_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - suudu_net

  suudu_pgadmin:
    image: dpage/pgadmin4:snapshot
    container_name: suudu_pgadmin
    restart: unless-stopped
    volumes:
      - suudu_pgadmin_data:/var/lib/pgadmin
    env_file:
      - .env
    depends_on:
      - suudu_db
    networks:
      - suudu_net

  # Sauvegarde automatique quotidienne de la base.
  # Meme image que suudu_db pour garantir que pg_dump a exactement la version du
  # serveur. Le dump passe par le reseau interne (-h suudu_db), sans binaire
  # docker ni acces au socket de l'hote : ce conteneur ne peut rien faire
  # d'autre que lire la base.
  # Retention : BACKUP_RETENTION fichiers (14 par defaut), soit ~2 semaines.
  # Il n'existe aucune restauration automatique : elle reste une operation
  # deliberee via ./db_restore.sh, pour qu'un simple redemarrage ne puisse
  # jamais ecraser les donnees de production.
  suudu_backup:
    image: postgres:15.15-trixie
    container_name: suudu_backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      suudu_db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Sauvegarde automatique : toutes les $${BACKUP_INTERVAL}s, retention $${BACKUP_RETENTION}."
        while true; do
          HORODATAGE=$$(date +%Y%m%d_%H%M%S)
          FICHIER="/backups/suudu_db_$${HORODATAGE}.dump"
          if pg_dump -h suudu_db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -F c -f "$${FICHIER}"; then
            echo "[$$(date -Is)] sauvegarde OK : $${FICHIER}"
            ls -1t /backups/suudu_db_*.dump 2>/dev/null \
              | tail -n +$$((BACKUP_RETENTION + 1)) \
              | while read -r vieux; do echo "[$$(date -Is)] purge : $${vieux}"; rm -f "$${vieux}"; done
          else
            echo "[$$(date -Is)] ECHEC de la sauvegarde" >&2
          fi
          sleep "$${BACKUP_INTERVAL}"
        done
    networks:
      - suudu_net

volumes:
  suudu_postgres_data:
  suudu_pgadmin_data:
  suudu_redis_data:
  suudu_security_logs:
  
networks:
  suudu_net:
    driver: bridge
    name: suudu_network