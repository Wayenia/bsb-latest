services:
  suudu_backend:
    build: .
    container_name: suudu_backend${COMPOSE_SUFFIX:-}
    restart: unless-stopped
    volumes:
      - .:/app
      # Volume nomme et non bind mount : initialise avec les droits de l'image,
      # donc inscriptible par appuser (README 9).
      - suudu_staticfiles:/app/staticfiles
      - ${MEDIA_DIR:-./media}:/app/media
      - suudu_security_logs:/app/logs
    command: ["./entrypoint.sh"]
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - HOST_IP=${HOST_IP:-}
    depends_on:
      suudu_db:
        condition: service_healthy
      suudu_redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login', timeout=5)"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - suudu_net

  suudu_db:
    image: postgres:18.6-trixie
    container_name: suudu_db${COMPOSE_SUFFIX:-}
    volumes:
      - suudu_postgres_data_18:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # PostgreSQL 18 place par defaut ses donnees dans un sous-dossier par
      # version sous /var/lib/postgresql ; on conserve l'emplacement classique
      # pour garder le meme volume monte sur /var/lib/postgresql/data (README 7.5).
      PGDATA: /var/lib/postgresql/data
    restart: always
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      - suudu_net

  suudu_nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: suudu_nginx${COMPOSE_SUFFIX:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - suudu_staticfiles:/app/staticfiles:ro
      - ${MEDIA_DIR:-./media}:/app/media:ro
    depends_on:
      suudu_backend:
        condition: service_healthy
    networks:
      - suudu_net

  suudu_redis:
    image: redis:bookworm
    container_name: suudu_redis${COMPOSE_SUFFIX:-}
    restart: unless-stopped
    volumes:
      - suudu_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - suudu_net

  suudu_pgadmin:
    image: dpage/pgadmin4:snapshot
    container_name: suudu_pgadmin${COMPOSE_SUFFIX:-}
    restart: unless-stopped
    volumes:
      - suudu_pgadmin_data:/var/lib/pgadmin
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      - suudu_db
    networks:
      - suudu_net

  # Sauvegarde quotidienne, par le reseau interne et sans acces au socket Docker.
  # Aucune restauration automatique : elle passe par ./db_restore.sh (README 7).
  suudu_backup:
    image: postgres:18.6-trixie
    container_name: suudu_backup${COMPOSE_SUFFIX:-}
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      suudu_db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Sauvegarde automatique : toutes les $${BACKUP_INTERVAL}s, retention $${BACKUP_RETENTION}."
        while true; do
          HORODATAGE=$$(date +%Y%m%d_%H%M%S)
          FICHIER="/backups/suudu_db_$${HORODATAGE}.dump"
          if pg_dump -h suudu_db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -F c -f "$${FICHIER}"; then
            echo "[$$(date -Is)] sauvegarde OK : $${FICHIER}"
            ls -1t /backups/suudu_db_*.dump 2>/dev/null \
              | tail -n +$$((BACKUP_RETENTION + 1)) \
              | while read -r vieux; do echo "[$$(date -Is)] purge : $${vieux}"; rm -f "$${vieux}"; done
          else
            echo "[$$(date -Is)] ECHEC de la sauvegarde" >&2
          fi
          sleep "$${BACKUP_INTERVAL}"
        done
    networks:
      - suudu_net

  # Planificateur du rapport d'inspection : verifie a intervalle regulier si une
  # echeance du reglage d'ecran est atteinte et, le cas echeant, envoie le
  # rapport. La commande est auto-regulee (n'envoie jamais deux fois la meme
  # echeance), donc une verification frequente est sans risque (README 9.5).
  suudu_audit:
    build: .
    container_name: suudu_audit${COMPOSE_SUFFIX:-}
    restart: unless-stopped
    volumes:
      - .:/app
      # Meme volume de logs que le backend : la configuration de journalisation
      # ecrit dans /app/logs, sinon toute commande manage.py echoue au demarrage.
      - suudu_security_logs:/app/logs
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - AUDIT_SCAN_INTERVAL=${AUDIT_SCAN_INTERVAL:-3600}
    depends_on:
      suudu_db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        echo "Planificateur du rapport d'audit : verification toutes les $${AUDIT_SCAN_INTERVAL}s."
        while true; do
          python manage.py envoyer_rapport_audit --auto || echo "[audit] verification en echec, ignoree"
          sleep "$${AUDIT_SCAN_INTERVAL}"
        done
    networks:
      - suudu_net

  # Assistant IA local (lecture seule). Ne demarre qu'avec le profil "ai"
  # (via ./bascule_ai.sh). Aucun port expose : joignable seulement en interne.
  suudu_ollama:
    image: ollama/ollama:latest
    container_name: suudu_ollama${COMPOSE_SUFFIX:-}
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - suudu_ollama_data:/root/.ollama
    networks:
      - suudu_net

volumes:
  suudu_postgres_data_18:
  suudu_ollama_data:
  suudu_pgadmin_data:
  suudu_redis_data:
  suudu_security_logs:
  suudu_staticfiles:
  
networks:
  # Pas de nom fixe : Compose prefixe le reseau par projet, ce qui isole
  # automatiquement un 2e stack (staging) de la prod (voir staging.sh).
  suudu_net:
    driver: bridge